name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチに続けて push したら、古い実行を止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 型チェック・ESLint・Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: yarn
      # NOTE: swisseph はネイティブアドオンなので、ここでビルドが走る
      - run: yarn install --frozen-lockfile
      - run: yarn tsc --noEmit
      - run: yarn lint:check
      - run: yarn format:check

  test:
    name: テスト（${{ matrix.tz }}）
    runs-on: ubuntu-latest
    strategy:
      # 1つのタイムゾーンで失敗しても、ほかの結果を見られるようにする
      fail-fast: false
      matrix:
        # 本番のサーバーは UTC で動き、利用者のブラウザは日本時間とは限らない
        tz: [Asia/Tokyo, UTC, America/New_York]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: yarn
      - run: yarn install --frozen-lockfile
      # テストコードの型チェックを含む
      - run: yarn test

  build:
    name: ビルドと、サーバーの確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Vercelと同じように、必要なファイルだけを切り出した形でビルドする。
      # swisseph のネイティブバイナリが含まれているかは、ビルドの最後に確認される
      - run: yarn build
        env:
          NEXT_OUTPUT: standalone
      - name: ページを追加・削除したら、yarn path を実行する
        run: git diff --exit-code -- 'src/lib/$path.ts'
      # rewrites とヘッダーは、実際にリクエストを送らないと確かめられない
      - name: サーバーを起動して、確認する
        run: |
          # 切り出した形には、public が入らない。フォントを配信できるように、コピーする
          cp -r public .next/standalone/public
          node .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          node scripts/check-server.js http://127.0.0.1:3000
        env:
          HOSTNAME: 127.0.0.1
          PORT: 3000
      - name: サーバーのログ
        if: failure()
        run: cat server.log
